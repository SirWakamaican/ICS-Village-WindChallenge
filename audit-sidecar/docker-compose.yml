# This sidecar can be brought up at any time - before, after, or between
# challenge stacks (bh-intellirupter, dnpchallenge, mitm-modbus, mqtthelper,
# viz, re-challenge). It does NOT declare those challenge networks statically
# (which would make Docker refuse to start it until every one exists).
# Instead it mounts the Docker socket and, at runtime, attaches itself to
# each challenge network as that challenge comes up and detaches as it goes
# down (see network_monitor in sidecar.py). Bring challenges up/down freely
# while this keeps running.
#
# This container joins every challenge's network as an additional member,
# the same way a shared span/tap port would on real hardware - each
# challenge's own network stays independent from the others; this is just
# one more thing attached to all of them at once, purely to observe/
# interact, not to route between them.
services:
  sidecar:
    build: .
    container_name: audit-sidecar
    restart: unless-stopped
    # NET_ADMIN/NET_RAW (rather than full `privileged`) is the minimum
    # capability set scapy needs to sniff on all these interfaces.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8000:8000"
    # The Docker socket lets the sidecar attach/detach itself to each
    # challenge network dynamically. This grants Docker control (effectively
    # host root) to this container - see README.md "Security note".
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  default:
    # Explicit subnet (like every other challenge) so audit-sidecar/ can attach
    # with a known static IP and self-identify this network. Must match
    # audit-sidecar's NETWORK_LABELS entry (172.18.0.) and the re-challenge
    # block in audit-sidecar/docker-compose.yml.
    ipam:
      config:
        - subnet: 172.18.0.0/24
